<polyline points="1630,1190 1690,1190 1690,1690 270,1690 270,1626" fill="none" stroke="#73839f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1630,1380 1690,1380 1690,1690 270,1690 270,1626" fill="none" stroke="#73839f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110.0" y="238.0" width="320" height="104" rx="15" fill="#132e38" stroke="#63e0d9" stroke-width="1.7"/>
<text x="270" y="270.0" fill="#63e0d9" font-size="18" font-weight="650" text-anchor="middle">01  Enter fictional loan</text>
<text x="270" y="296.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Borrower + property context</text>
<text x="270" y="319.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Loan, value, NOI, debt service</text>
<polygon points="800,229.0 907.0,290 800,351.0 693.0,290" fill="#282c47" stroke="#9faed0" stroke-width="2"/>
<text x="800" y="296" fill="#9faed0" font-size="18" font-weight="650" text-anchor="middle">Inputs valid?</text>
<rect x="110.0" y="426.0" width="320" height="104" rx="15" fill="#452d21" stroke="#efb86e" stroke-width="1.7"/>
<text x="270" y="458.0" fill="#efb86e" font-size="18" font-weight="650" text-anchor="middle">Correct input errors</text>
<text x="270" y="484.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Field-specific feedback</text>
<text x="270" y="507.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Nothing recorded on failure</text>
<rect x="590.0" y="428.0" width="420" height="104" rx="15" fill="#242444" stroke="#aea0ff" stroke-width="1.7"/>
<text x="800" y="460.0" fill="#aea0ff" font-size="18" font-weight="650" text-anchor="middle">02  Calculate financial ratios</text>
<text x="800" y="486.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">DSCR · LTV · debt yield</text>
<text x="800" y="509.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Compare before display rounding</text>
<rect x="590.0" y="598.0" width="420" height="104" rx="15" fill="#242444" stroke="#aea0ff" stroke-width="1.7"/>
<text x="800" y="630.0" fill="#aea0ff" font-size="18" font-weight="650" text-anchor="middle">03  Evaluate all three rules</text>
<text x="800" y="656.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Pass / review / decline per rule</text>
<text x="800" y="679.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Decline &gt; review &gt; eligible</text>
<rect x="590.0" y="764.0" width="420" height="112" rx="15" fill="#242444" stroke="#aea0ff" stroke-width="1.7"/>
<text x="800" y="796.0" fill="#aea0ff" font-size="18" font-weight="650" text-anchor="middle">04  Record evaluation evidence</text>
<text x="800" y="822.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Inputs, ratios, reasons + outcome</text>
<text x="800" y="845.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Policy snapshot, UUID + UTC time</text>
<polygon points="800,949.0 907.0,1010 800,1071.0 693.0,1010" fill="#282c47" stroke="#9faed0" stroke-width="2"/>
<text x="800" y="1016" fill="#9faed0" font-size="18" font-weight="650" text-anchor="middle">Any decline?</text>
<polygon points="800,1129.0 907.0,1190 800,1251.0 693.0,1190" fill="#282c47" stroke="#9faed0" stroke-width="2"/>
<text x="800" y="1196" fill="#9faed0" font-size="18" font-weight="650" text-anchor="middle">Any review?</text>
<rect x="640.0" y="1330.0" width="320" height="100" rx="15" fill="#173d38" stroke="#8ce8cc" stroke-width="1.7"/>
<text x="800" y="1362.0" fill="#8ce8cc" font-size="18" font-weight="650" text-anchor="middle">All three rules pass</text>
<text x="800" y="1388.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">No decline or review triggers</text>
<rect x="1250.0" y="954.0" width="380" height="112" rx="15" fill="#42253c" stroke="#f194c2" stroke-width="1.7"/>
<text x="1440" y="986.0" fill="#f194c2" font-size="18" font-weight="650" text-anchor="middle">SCREENING DECLINE</text>
<text x="1440" y="1012.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Explain every triggered rule</text>
<text x="1440" y="1035.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Outside fictional screening limits</text>
<rect x="1250.0" y="1134.0" width="380" height="112" rx="15" fill="#40351f" stroke="#f4d28a" stroke-width="1.7"/>
<text x="1440" y="1166.0" fill="#f4d28a" font-size="18" font-weight="650" text-anchor="middle">ANALYST REVIEW</text>
<text x="1440" y="1192.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Explain the rule exceptions</text>
<text x="1440" y="1215.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Closer analyst review is needed</text>
<rect x="1250.0" y="1324.0" width="380" height="112" rx="15" fill="#173d38" stroke="#8ce8cc" stroke-width="1.7"/>
<text x="1440" y="1356.0" fill="#8ce8cc" font-size="18" font-weight="650" text-anchor="middle">ELIGIBLE FOR UNDERWRITING</text>
<text x="1440" y="1382.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Explain the three passing rules</text>
<text x="1440" y="1405.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Proceed to fictional underwriting</text>
<rect x="100.0" y="1514.0" width="340" height="112" rx="15" fill="#132e38" stroke="#63e0d9" stroke-width="1.7"/>
<text x="270" y="1546.0" fill="#63e0d9" font-size="18" font-weight="650" text-anchor="middle">05  Review / inspect / export</text>
<text x="270" y="1572.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Read the saved rule explanations</text>
<text x="270" y="1595.0" fill="#d0daed" font-size="16" font-weight="400" text-anchor="middle">Revisit history or download JSON</text>
<rect x="1200" y="278" width="460" height="428" rx="18" fill="#11192d" stroke="#454262"/>
<text x="1230" y="319" fill="#c5b6f5" font-size="16" font-weight="700" text-anchor="start">FICTIONAL POLICY AT A GLANCE</text>
<text x="1230" y="365" fill="#e8edff" font-size="19" font-weight="650" text-anchor="start">DSCR</text>
<text x="1230" y="392" fill="#f4d28a" font-size="17" font-weight="400" text-anchor="start">Review &lt; 1.25×</text>
<text x="1430" y="392" fill="#f194c2" font-size="17" font-weight="400" text-anchor="start">Decline &lt; 1.00×</text>
<text x="1230" y="459" fill="#e8edff" font-size="19" font-weight="650" text-anchor="start">LTV</text>
<text x="1230" y="486" fill="#f4d28a" font-size="17" font-weight="400" text-anchor="start">Review &gt; 75%</text>
<text x="1430" y="486" fill="#f194c2" font-size="17" font-weight="400" text-anchor="start">Decline &gt; 85%</text>
<text x="1230" y="553" fill="#e8edff" font-size="19" font-weight="650" text-anchor="start">Debt yield</text>
<text x="1230" y="580" fill="#f4d28a" font-size="17" font-weight="400" text-anchor="start">Review &lt; 8%</text>
<text x="1430" y="580" fill="#f194c2" font-size="17" font-weight="400" text-anchor="start">Decline &lt; 6%</text>
<text x="1230" y="668" fill="#b7c5df" font-size="16" font-weight="400" text-anchor="start">Exact thresholds use strict inequalities.</text>
<text x="1230" y="691" fill="#b7c5df" font-size="16" font-weight="400" text-anchor="start">Property type is contextual only.</text>
<text x="800" y="1510" fill="#afa0ff" font-size="16" font-weight="700" text-anchor="middle">EVIDENCE STORAGE</text>
<text x="800" y="1544" fill="#c0cce1" font-size="17" font-weight="400" text-anchor="middle">Local app: SQLite history</text>
<text x="800" y="1572" fill="#c0cce1" font-size="17" font-weight="400" text-anchor="middle">Public demo: session history only</text>
<text x="800" y="1600" fill="#97a7c2" font-size="16" font-weight="400" text-anchor="middle">Re-evaluation creates a new record.</text>
<text x="80" y="1750" fill="#afa8d7" font-size="15" font-weight="700" text-anchor="start">READING THE DIAGRAM</text>
<text x="80" y="1782" fill="#c2cce1" font-size="17" font-weight="400" text-anchor="start">Teal = analyst action  ·  Violet = system action  ·  Diamonds = validation / routing  ·  Outcome color is paired with a text label.</text>
<text x="80" y="1812" fill="#98a9c6" font-size="17" font-weight="400" text-anchor="start">Screening only, not loan approval. Next steps are explanatory; no task assignment or downstream underwriting integration.</text>
</g></svg>
