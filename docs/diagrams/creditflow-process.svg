<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1840" viewBox="0 0 1800 1840" role="img" aria-labelledby="title desc">
<title id="title">CreditFlow analyst and system swimlane process</title><desc id="desc">Fictional loan intake, input correction, calculation of all financial ratios and rules, saved evidence, decline-first routing, and analyst review of explanations and JSON export. Local evidence uses SQLite; hosted demo uses session history.</desc>
